id: com.rimerosolutions.Entrusted

runtime: org.gnome.Platform
runtime-version: "48"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.llvm20
command: entrusted
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=ipc
  - --env=FLATPAK=1
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/llvm20/bin
  prepend-ld-library-path: "/usr/lib/sdk/llvm20/lib"
modules:
  - name: entrusted
    buildsystem: simple
    sources:
      - type: git
        url: https://github.com/rimerosolutions/entrusted
        branch: develop
      - cargo-sources.json
    build-options:
      env:
        CARGO_HOME: /run/build/entrusted/cargo
        XDG_CACHE_HOME: /run/build/entrusted/cache
        LC_ALL: C.utf8
    build-commands:
      - cargo --offline fetch --manifest-path /run/build/entrusted/app/Cargo.toml --verbose
      - source /usr/lib/sdk/llvm20/enable.sh
      - cargo --offline build --manifest-path /run/build/entrusted/app/Cargo.toml --release --features gui
      - install -Dm644 -t /app/share/metainfo/ ci_cd/linux/com.rimerosolutions.Entrusted.metainfo.xml
      - install -Dm644 -t /app/share/applications/ ci_cd/linux/com.rimerosolutions.Entrusted.desktop 
      - install -Dm755 -t /app/bin/entrusted /run/build/entrusted/app/target/release/entrusted-gui
      - install -Dm644 ci_cd/linux/icon-32x32.png /app/share/icons/hicolor/32x32/apps/com.rimerosolutions.Entrusted.png
      - install -Dm644 ci_cd/linux/icon-128x128.png /app/share/icons/hicolor/128x128/apps/com.rimerosolutions.Entrusted.png
      - install -Dm644 ci_cd/linux/icon-256x256.png /app/share/icons/hicolor/256x256/apps/com.rimerosolutions.Entrusted.png
      - install -Dm644 ci_cd/linux/icon-512x512.png /app/share/icons/hicolor/256x256@2/apps/com.rimerosolutions.Entrusted.png
      - cargo --offline clean --manifest-path /run/build/entrusted/app/Cargo.toml
    post-install:
      - install -Dm644 LICENSE /app/share/licenses/com.rimerosolutions.Entrusted/LICENSE
